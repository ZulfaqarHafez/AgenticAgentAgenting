[package]
name = "hive-agent-backend"
version = "0.1.0"
edition = "2024"
description = "Rust backend for the Hive Circle multi-agent system."
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
indexmap = { version = "2.14.2", features = ["serde"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["chrono", "indexmap"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
